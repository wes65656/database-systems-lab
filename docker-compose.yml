services:
  db:
    image: postgres:18-alpine
    container_name: database-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab_dev_only
      POSTGRES_DB: database_lab
      TZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql:/lab/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d database_lab"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
