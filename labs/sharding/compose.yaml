name: database-lab-sharding
services:
  shard0:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sharding_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab_dev_only
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - shard0data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d sharding_lab"]
      interval: 2s
      timeout: 5s
      retries: 30
  shard1:
