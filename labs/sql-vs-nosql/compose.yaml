name: database-lab-sql-nosql
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sql_nosql_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab_dev_only
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d sql_nosql_lab"]
      interval: 2s
      timeout: 5s
      retries: 30
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: lab
      MONGO_INITDB_ROOT_PASSWORD: lab_dev_only
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "lab", "-p", "lab_dev_only", "--authenticationDatabase", "admin", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 2s
      timeout: 10s
      retries: 30
volumes:
  pgdata:
  mongodata:
